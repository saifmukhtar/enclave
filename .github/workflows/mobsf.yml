name: "MobSF Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mobsfscan:
    name: MobSF Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run MobSF Static Analysis
      uses: MobSF/mobsfscan-action@v1
      with:
        args: '. --sarif --output mobsf-results.sarif'
      continue-on-error: true

    - name: Upload MobSF Scan SARIF report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: mobsf-results.sarif
