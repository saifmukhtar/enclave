RepoType: git
Repo: https://github.com/saifmukhtar/enclave.git

Builds:
  - versionName: '3.0.0'
    versionCode: 4
    commit: 356cd1e1d81414a6b540d76df597627726992b97
    subdir: apps/android/app
    submodules: true
    ndk: r25c
    sudo:
      - apt-get update
      - apt-get install -y rustup clang libclang-dev cmake make protobuf-compiler git
    prebuild:
      - echo "sdk.dir=$ANDROID_HOME" > ../local.properties
      - echo "ndk.dir=$$NDK$$" >> ../local.properties
      - echo "sdk.dir=$ANDROID_HOME" > ../../../libsignal-src/java/local.properties
      - echo "ndk.dir=$$NDK$$" >> ../../../libsignal-src/java/local.properties
      - patch -p1 -d ../../../libsignal-src < ../libsignal.patch
      - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    gradle:
      - yes
    gradleprops:
      - fdroid=true
    scandelete:
      - backend
      - libsignal-src/rust/attest/fuzz/seeds/dcap/cds2_test

AutoUpdateMode: Version
UpdateCheckMode: Tags
